<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Howard</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
background:#111827;
color:white;
height:100vh;
display:flex;
flex-direction:column;
}

header{
background:#1f2937;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
font-size:20px;
font-weight:bold;
}

button{
background:#2563eb;
border:none;
padding:8px 14px;
border-radius:6px;
color:white;
cursor:pointer;
font-weight:bold;
}

button:hover{opacity:.9}

.container{
flex:1;
display:flex;
height:100%;
}

.sidebar{
width:260px;
background:#1f2937;
border-right:1px solid #374151;
overflow-y:auto;
}

.userItem{
padding:15px;
border-bottom:1px solid #374151;
cursor:pointer;
}

.userItem:hover{
background:#374151;
}

.chatArea{
flex:1;
display:flex;
flex-direction:column;
}

.messages{
flex:1;
padding:20px;
overflow-y:auto;
}

.msg{
max-width:70%;
padding:12px 16px;
border-radius:12px;
margin-bottom:14px;
}

.me{
background:#2563eb;
margin-left:auto;
}

.other{
background:#374151;
}

.time{
font-size:11px;
opacity:.6;
margin-top:6px;
}

.inputArea{
display:flex;
gap:10px;
padding:15px;
background:#1f2937;
}

input{
flex:1;
padding:14px;
border-radius:8px;
border:none;
outline:none;
background:#374151;
color:white;
font-size:16px;
}

.authBox{
width:320px;
margin:120px auto;
display:flex;
flex-direction:column;
gap:15px;
}

.hidden{display:none}
</style>
</head>
<body>

<header>
<div>Howard</div>
<button id="logoutBtn" class="hidden">Çıkış Yap</button>
</header>

<div id="authScreen" class="authBox">
<input id="username" placeholder="Kullanıcı Adı">
<input id="password" type="password" placeholder="Şifre">
<button id="loginBtn">Giriş Yap / Kayıt Ol</button>
</div>

<div id="chatScreen" class="container hidden">
<div id="sidebar" class="sidebar hidden"></div>

<div class="chatArea">
<div id="messages" class="messages"></div>
<div class="inputArea">
<input id="messageInput" placeholder="Howard ile konuş...">
<button id="sendBtn">Gönder</button>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword, 
  createUserWithEmailAndPassword, 
  signOut, 
  onAuthStateChanged,
  setPersistence,
  browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyApJA39yInAqrWjYIa7kh7lLohV71OrsHg",
authDomain: "howardbot-a1c62.firebaseapp.com",
projectId: "howardbot-a1c62",
storageBucket: "howardbot-a1c62.appspot.com",
messagingSenderId: "616052817819",
appId: "1:616052817819:web:8e496016db4f365a096b3e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let myUsername=null;
let isAdmin=false;
let selectedRoom=null;
let unsubscribe=null;

const authScreen=document.getElementById("authScreen");
const chatScreen=document.getElementById("chatScreen");
const sidebar=document.getElementById("sidebar");
const logoutBtn=document.getElementById("logoutBtn");
const messagesDiv=document.getElementById("messages");

document.getElementById("loginBtn").onclick=async()=>{
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value.trim();
  if(!username||!password) return alert("Bilgiler eksik");

  const email=username.toLowerCase()+"@howard.com";

  try{
    // ÖNEMLİ: burada persistence'i "session" yapıyoruz.
    // Böylece oturum sadece bu sekmeye özel olur; diğer sekmeler etkilenmez.
    await setPersistence(auth, browserSessionPersistence);

    // önce giriş yapmayı dene
    await signInWithEmailAndPassword(auth,email,password);
  }catch(signInError){
    // giriş başarısızsa yeni kullanıcı oluşturmayı dene (aynı persistence kullanılıyor)
    try{
      await createUserWithEmailAndPassword(auth,email,password);
    }catch(e){
      console.error("Auth hata:", e);
      alert("Giriş başarısız");
    }
  }
};

onAuthStateChanged(auth,(user)=>{
  if(user){
    authScreen.classList.add("hidden");
    chatScreen.classList.remove("hidden");
    logoutBtn.classList.remove("hidden");

    myUsername=user.email.replace("@howard.com","");
    // admin kontrolünü olduğu gibi bıraktım
    isAdmin = user.email==="howard@howard.com";

    if(isAdmin){
      sidebar.classList.remove("hidden");
      loadUserRooms();
    }else{
      sidebar.classList.add("hidden");
      selectedRoom=myUsername;
      loadChat(myUsername);
    }

  }else{
    authScreen.classList.remove("hidden");
    chatScreen.classList.add("hidden");
    logoutBtn.classList.add("hidden");
    // temizle
    myUsername=null;
    selectedRoom=null;
    if(unsubscribe){ unsubscribe(); unsubscribe=null; }
    messagesDiv.innerHTML="";
  }
});

logoutBtn.onclick=()=>signOut(auth);

function loadUserRooms(){
  const chatsRef=collection(db,"chats");

  onSnapshot(chatsRef,(snap)=>{
    sidebar.innerHTML="";
    snap.forEach(docSnap=>{
      const room=docSnap.id;
      const div=document.createElement("div");
      div.className="userItem";
      div.innerText=room;
      div.onclick=()=>{
        selectedRoom=room;
        loadChat(room);
      };
      sidebar.appendChild(div);
    });
  });
}

function loadChat(room){
  if(unsubscribe) unsubscribe();
  messagesDiv.innerHTML="";

  const q=query(collection(db,"chats",room,"messages"),orderBy("time"));

  unsubscribe=onSnapshot(q,(snap)=>{
    messagesDiv.innerHTML="";
    snap.forEach(docSnap=>{
      const data=docSnap.data();
      const div=document.createElement("div");

      div.className = data.from===myUsername ? "msg me" : "msg other";

      div.innerHTML=`
        <b>${data.from}</b><br>
        ${data.text}
        <div class="time">${new Date(data.time).toLocaleTimeString()}</div>
      `;

      messagesDiv.appendChild(div);
    });
    messagesDiv.scrollTop=messagesDiv.scrollHeight;
  });
}

document.getElementById("sendBtn").onclick=sendMessage;
document.getElementById("messageInput").addEventListener("keypress",(e)=>{
  if(e.key==="Enter") sendMessage();
});

async function sendMessage(){
  const text=document.getElementById("messageInput").value.trim();
  if(!text) return;

  const room=isAdmin?selectedRoom:myUsername;
  if(!room) return;

  await addDoc(collection(db,"chats",room,"messages"),{
    from: myUsername,
    text:text,
    time:Date.now()
  });

  document.getElementById("messageInput").value="";
}
</script>
</body>
</html>
