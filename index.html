<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Howard</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
background:#111827;
color:white;
height:100vh;
display:flex;
flex-direction:column;
}

header{
background:#1f2937;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
font-size:20px;
font-weight:bold;
}

button{
background:#2563eb;
border:none;
padding:8px 14px;
border-radius:6px;
color:white;
cursor:pointer;
font-weight:bold;
}

button:hover{opacity:.9}

.container{
flex:1;
display:flex;
height:100%;
}

.sidebar{
width:260px;
background:#1f2937;
border-right:1px solid #374151;
overflow-y:auto;
display:flex;
flex-direction:column;
}

.sidebarHeader{
padding:12px;
border-bottom:1px solid #374151;
display:flex;
gap:8px;
align-items:center;
}

.searchInput{
flex:1;
padding:8px;
border-radius:6px;
border:none;
outline:none;
background:#374151;
color:white;
}

.userList{
overflow-y:auto;
flex:1;
}

.userItem{
padding:15px;
border-bottom:1px solid #374151;
cursor:pointer;
}

.userItem:hover{
background:#374151;
}

.chatArea{
flex:1;
display:flex;
flex-direction:column;
}

.messages{
flex:1;
padding:20px;
overflow-y:auto;
}

.msg{
max-width:70%;
padding:12px 16px;
border-radius:12px;
margin-bottom:14px;
}

.me{
background:#2563eb;
margin-left:auto;
}

.other{
background:#374151;
}

.time{
font-size:11px;
opacity:.6;
margin-top:6px;
}

.inputArea{
display:flex;
gap:10px;
padding:15px;
background:#1f2937;
}

input{
flex:1;
padding:14px;
border-radius:8px;
border:none;
outline:none;
background:#374151;
color:white;
font-size:16px;
}

.authBox{
width:320px;
margin:120px auto;
display:flex;
flex-direction:column;
gap:15px;
}

.hidden{display:none}
</style>
</head>
<body>

<header>
<div>Howard</div>
<button id="logoutBtn" class="hidden">Çıkış Yap</button>
</header>

<div id="authScreen" class="authBox">
<input id="username" placeholder="Kullanıcı Adı">
<input id="password" type="password" placeholder="Şifre">
<button id="loginBtn">Giriş Yap / Kayıt Ol</button>
</div>

<div id="chatScreen" class="container hidden">
<div id="sidebar" class="sidebar hidden">
  <div class="sidebarHeader">
    <input id="searchInput" class="searchInput" placeholder="Kullanıcı ara..." />
    <button id="refreshBtn">Yenile</button>
  </div>
  <div id="userList" class="userList"></div>
</div>

<div class="chatArea">
<div id="messages" class="messages"></div>
<div class="inputArea">
<input id="messageInput" placeholder="Howard ile konuş...">
<button id="sendBtn">Gönder</button>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword, 
  createUserWithEmailAndPassword, 
  signOut, 
  onAuthStateChanged, 
  setPersistence, 
  browserSessionPersistence 
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  addDoc, 
  query, 
  orderBy, 
  onSnapshot,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyApJA39yInAqrWjYIa7kh7lLohV71OrsHg",
authDomain: "howardbot-a1c62.firebaseapp.com",
projectId: "howardbot-a1c62",
storageBucket: "howardbot-a1c62.appspot.com",
messagingSenderId: "616052817819",
appId: "1:616052817819:web:8e496016db4f365a096b3e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let myUsername=null;
let isAdmin=false;
let selectedRoom=null;
let unsubscribe=null;
let roomsList = []; // admin için tüm odalar
let roomsUnsub = null;

const authScreen=document.getElementById("authScreen");
const chatScreen=document.getElementById("chatScreen");
const sidebar=document.getElementById("sidebar");
const logoutBtn=document.getElementById("logoutBtn");
const messagesDiv=document.getElementById("messages");
const userListDiv=document.getElementById("userList");
const searchInput=document.getElementById("searchInput");
const refreshBtn=document.getElementById("refreshBtn");

document.getElementById("loginBtn").onclick=async()=>{
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value.trim();
  if(!username||!password) return alert("Bilgiler eksik");

  const email=username.toLowerCase()+"@howard.com";

  try{
    await setPersistence(auth, browserSessionPersistence);
    await signInWithEmailAndPassword(auth,email,password);
  }catch{
    try{
      await createUserWithEmailAndPassword(auth,email,password);
    }catch(e){alert("Giriş başarısız");}
  }
};

onAuthStateChanged(auth,(user)=>{
  if(user){
    authScreen.classList.add("hidden");
    chatScreen.classList.remove("hidden");
    logoutBtn.classList.remove("hidden");

    myUsername=user.email.replace("@howard.com","");
    isAdmin = user.email==="howard@howard.com";

    if(isAdmin){
      sidebar.classList.remove("hidden");
      // admin görünümü: arama aktif et
      searchInput.value = "";
      loadUserRooms();
    }else{
      sidebar.classList.add("hidden");
      selectedRoom=myUsername;
      loadChat(myUsername);
    }

  }else{
    authScreen.classList.remove("hidden");
    chatScreen.classList.add("hidden");
    logoutBtn.classList.add("hidden");
    myUsername=null;
    selectedRoom=null;
    if(unsubscribe){ unsubscribe(); unsubscribe=null; }
    if(roomsUnsub){ roomsUnsub(); roomsUnsub=null; roomsList=[]; userListDiv.innerHTML=""; }
    messagesDiv.innerHTML="";
  }
});

logoutBtn.onclick=()=>signOut(auth);

// Admin: odaları al ve göster (arama ile filtrelenebilir)
function loadUserRooms(){
  const chatsRef = collection(db,"chats");

  if(roomsUnsub) roomsUnsub();

  roomsUnsub = onSnapshot(chatsRef,(snap)=>{
    roomsList = [];
    snap.forEach(docSnap=>{
      roomsList.push(docSnap.id);
    });
    renderRoomList();
  });
}

// admin için refresh butonu
refreshBtn.onclick = () => {
  if(isAdmin) loadUserRooms();
};

function renderRoomList(){
  const q = searchInput.value.trim().toLowerCase();
  userListDiv.innerHTML = "";
  const filtered = roomsList.filter(r => r.toLowerCase().includes(q));
  // sıralama: en yeni önce olabilir; burada alfabe
  filtered.sort();

  if(filtered.length===0){
    const no = document.createElement("div");
    no.className="userItem";
    no.innerText="Kullanıcı bulunamadı";
    userListDiv.appendChild(no);
    return;
  }

  filtered.forEach(room=>{
    const div=document.createElement("div");
    div.className="userItem";
    div.innerText=room;
    div.onclick=()=>{
      selectedRoom=room;
      loadChat(room);
    };
    userListDiv.appendChild(div);
  });
}

searchInput.addEventListener("input", renderRoomList);

// Tüm kullanıcıların mesajlarını yükle (admin veya normal kullanıcı için)
function loadChat(room){
  if(unsubscribe) unsubscribe();
  messagesDiv.innerHTML="";

  const q = query(collection(db,"chats",room,"messages"), orderBy("time"));

  unsubscribe = onSnapshot(q,(snap)=>{
    messagesDiv.innerHTML="";
    snap.forEach(docSnap=>{
      const data = docSnap.data();

      // --- Güçlendirilmiş sender + time dönüşümü ---
      const sender = data.from ?? data.fromName ?? data.sender ?? data.name ?? "Howard";
      const rawTime = data.time;
      const timestamp = (rawTime && typeof rawTime.toMillis === "function") ? rawTime.toMillis() : rawTime;
      const timeStr = timestamp ? new Date(timestamp).toLocaleTimeString() : "";

      const div=document.createElement("div");
      div.className = (myUsername && sender === myUsername) ? "msg me" : "msg other";

      // Basit sanitize: text yerine güvenli text node ekleyelim (XSS riskini azaltır)
      const nameHtml = `<b>${escapeHtml(sender)}</b><br>`;
      const textHtml = escapeHtml(String(data.text ?? ""));
      div.innerHTML = nameHtml + textHtml + `<div class="time">${timeStr}</div>`;
      messagesDiv.appendChild(div);
    });
    messagesDiv.scrollTop=messagesDiv.scrollHeight;
  });
}

// Gönderme: önce parent dokümanı yarat ( böylece admin listesinde görünür )
document.getElementById("sendBtn").onclick=sendMessage;
document.getElementById("messageInput").addEventListener("keypress",(e)=>{
  if(e.key==="Enter") sendMessage();
});

async function sendMessage(){
  const text=document.getElementById("messageInput").value.trim();
  if(!text) return;

  const room=isAdmin?selectedRoom:myUsername;
  if(!room) return alert("Oda seçili değil.");

  try{
    // parent doc'u garantiyle oluştur (merge ile mevcutsa bozmaz)
    await setDoc(doc(db,"chats",room), { createdAt: Date.now(), room: room }, { merge: true });

    await addDoc(collection(db,"chats",room,"messages"),{
      from: myUsername,
      text:text,
      time:Date.now()
    });

    document.getElementById("messageInput").value="";
  }catch(e){
    console.error("Mesaj gönderme hatası:", e);
    alert("Mesaj gönderilemedi.");
  }
}

// küçük yardımcı: XSS için basit kaçış
function escapeHtml(unsafe) {
  return unsafe
       .replaceAll("&", "&amp;")
       .replaceAll("<", "&lt;")
       .replaceAll(">", "&gt;")
       .replaceAll('"', "&quot;")
       .replaceAll("'", "&#039;");
}

</script>
</body>
</html>
